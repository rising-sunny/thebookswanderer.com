<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FB Cover · The Books Wanderer</title>
<!--
  Portada de Facebook · 1640x624

  Render:
    chromium --headless --screenshot=facebook-cover.png --window-size=1640,624 \
             https://thebookswanderer.com/assets/social/facebook-cover.html

  Dos restricciones de Facebook que condicionan el diseño:

  1. RECORTE EN MOVIL. En escritorio se ve la imagen entera (proporcion 2.63:1),
     pero en movil se recorta a ~1.78:1 desde el centro: se pierden unos 300px
     por cada lado. Todo lo legible vive dentro de .safe.

  2. LA FOTO DE PERFIL. En escritorio se superpone sobre la esquina inferior
     izquierda, ocupando aproximadamente 230x230 desde x=48. Esa zona queda
     vacia a proposito: antes habia un circulo con el logo justo debajo, y la
     foto de perfil lo tapaba.
-->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1640px;
    height: 624px;
    overflow: hidden;
    background: #f0e8d6;
  }
  .cover {
    width: 1640px;
    height: 624px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 70% 90% at 88% 55%, rgba(43, 82, 64, 0.18) 0%, transparent 55%),
      radial-gradient(ellipse 50% 80% at 12% 40%, rgba(193, 145, 47, 0.10) 0%, transparent 50%),
      linear-gradient(135deg, #fdfaf3 0%, #f8f2e5 42%, #efe6d0 72%, #e8dfc8 100%);
    font-family: Georgia, "Times New Roman", "Palatino Linotype", serif;
    color: #1b3728;
  }

  /* Grano de papel */
  .cover::before {
    content: "";
    position: absolute;
    inset: 0;
    opacity: 0.35;
    pointer-events: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(27,55,40,0.03) 0 1px, transparent 1.5px),
      radial-gradient(circle at 70% 60%, rgba(27,55,40,0.025) 0 1px, transparent 1.5px),
      radial-gradient(circle at 40% 80%, rgba(169,124,34,0.04) 0 1px, transparent 1.5px);
    background-size: 18px 18px, 22px 22px, 16px 16px;
  }

  .gold-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 6px;
    background: linear-gradient(90deg, #a97c22 0%, #e2c47c 45%, #c1912f 55%, #a97c22 100%);
    z-index: 5;
  }

  /* Orbe verde con el libro */
  .panel-right {
    position: absolute;
    right: -60px;
    top: 50%;
    transform: translateY(-50%);
    width: 520px;
    height: 520px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 40%, rgba(226, 196, 124, 0.25) 0%, transparent 40%),
      radial-gradient(circle at 55% 55%, #2b5240 0%, #1b3728 55%, #10241a 100%);
    opacity: 0.92;
    z-index: 0;
  }
  .panel-right::after {
    content: "";
    position: absolute;
    inset: 28px;
    border-radius: 50%;
    border: 1.5px solid rgba(226, 196, 124, 0.35);
  }

  .book {
    position: absolute;
    right: 140px;
    top: 50%;
    transform: translateY(-46%);
    width: 280px;
    height: 180px;
    z-index: 2;
  }
  .book .page {
    position: absolute;
    bottom: 0;
    width: 48%;
    height: 100%;
    background: linear-gradient(180deg, #fdfaf3 0%, #f0e8d6 100%);
    border: 1px solid rgba(27, 55, 40, 0.12);
    box-shadow: 0 8px 20px rgba(16, 36, 26, 0.18);
  }
  .book .page.left {
    left: 0;
    border-radius: 8px 0 0 10px;
    transform: perspective(400px) rotateY(12deg);
    transform-origin: right center;
  }
  .book .page.right {
    right: 0;
    border-radius: 0 8px 10px 0;
    transform: perspective(400px) rotateY(-12deg);
    transform-origin: left center;
  }
  .book .spine {
    position: absolute;
    left: 50%;
    top: 6%;
    bottom: 0;
    width: 10px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #5c4030, #8b6914, #5c4030);
    border-radius: 2px;
    z-index: 2;
  }
  .book .line {
    position: absolute;
    left: 14%;
    right: 14%;
    height: 2px;
    background: rgba(27, 55, 40, 0.08);
    border-radius: 1px;
  }
  .book .page.left .line:nth-child(1) { top: 28%; }
  .book .page.left .line:nth-child(2) { top: 40%; }
  .book .page.left .line:nth-child(3) { top: 52%; }
  .book .page.left .line:nth-child(4) { top: 64%; width: 55%; }
  .book .page.right .line:nth-child(1) { top: 28%; }
  .book .page.right .line:nth-child(2) { top: 40%; }
  .book .page.right .line:nth-child(3) { top: 52%; }
  .book .page.right .line:nth-child(4) { top: 64%; width: 50%; }

  .glow {
    position: absolute;
    right: 180px;
    top: 70px;
    width: 220px;
    height: 160px;
    background: radial-gradient(ellipse at center, rgba(226, 196, 124, 0.55) 0%, transparent 70%);
    z-index: 1;
    pointer-events: none;
  }

  /* Hojas: el mismo SVG que cae en la portada del sitio, no bloques con
     border-radius. Consistencia de marca y bordes reales con nervadura. */
  .leaves {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  .leaves svg {
    position: absolute;
    display: block;
  }
  .lf1 { left: 44%; top: 12%; width: 30px; transform: rotate(24deg);  color: #c4501e; opacity: .55; }
  .lf2 { left: 52%; top: 30%; width: 22px; transform: rotate(-32deg); color: #a97c22; opacity: .45; }
  .lf3 { left: 38%; top: 74%; width: 26px; transform: rotate(48deg);  color: #8b2f27; opacity: .40; }
  .lf4 { left: 60%; top: 60%; width: 20px; transform: rotate(-14deg); color: #2b5240; opacity: .40; }
  .lf5 { left: 30%; top: 88%; width: 18px; transform: rotate(62deg);  color: #c1912f; opacity: .35; }
  .lf6 { left: 66%; top: 18%; width: 24px; transform: rotate(-48deg); color: #d9662f; opacity: .40; }
  .lf7 { left: 24%; top: 20%; width: 16px; transform: rotate(18deg);  color: #1b3728; opacity: .28; }

  /* Zona segura: sobrevive al recorte movil y esquiva la foto de perfil. */
  .safe {
    position: absolute;
    left: 300px;
    right: 470px;
    top: 0;
    bottom: 96px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    z-index: 4;
  }
  .eyebrow {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: #a97c22;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 74px;
    font-weight: 600;
    line-height: 1.04;
    letter-spacing: 0.005em;
    color: #1b3728;
    text-shadow: 0 1px 0 rgba(255,255,255,.5);
  }
  .rule {
    width: 110px;
    height: 3px;
    border-radius: 2px;
    background: linear-gradient(90deg, #c1912f, #e2c47c);
    margin: 20px 0 16px;
  }
  .tag {
    font-size: 27px;
    font-style: italic;
    color: #2b5240;
    line-height: 1.35;
    max-width: 620px;
  }
  .url {
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: #5c6157;
    margin-top: 22px;
  }

  /* Reservado para la foto de perfil en escritorio. Vacio a proposito. */
  .corner {
    position: absolute;
    left: 300px;
    bottom: 30px;
    font-family: "Segoe UI", system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(92, 97, 87, 0.55);
    z-index: 4;
  }
</style>
</head>
<body>
  <div class="cover">
    <div class="gold-bar"></div>
    <div class="panel-right"></div>
    <div class="glow"></div>

    <div class="leaves" aria-hidden="true">
      <svg class="lf1" viewBox="0 0 24 28"><path d="M12 3C7 7 4.5 11 5.5 15.5 6.4 19.5 9 21.5 12 22.5c3-1 5.6-3 6.5-7C19.5 11 17 7 12 3Z" fill="currentColor"/><path d="M12 22.5V6" stroke="rgba(0,0,0,.25)" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
      <svg class="lf2" viewBox="0 0 24 28"><path d="M12 3C7 7 4.5 11 5.5 15.5 6.4 19.5 9 21.5 12 22.5c3-1 5.6-3 6.5-7C19.5 11 17 7 12 3Z" fill="currentColor"/><path d="M12 22.5V6" stroke="rgba(0,0,0,.25)" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
      <svg class="lf3" viewBox="0 0 24 28"><path d="M12 3C7 7 4.5 11 5.5 15.5 6.4 19.5 9 21.5 12 22.5c3-1 5.6-3 6.5-7C19.5 11 17 7 12 3Z" fill="currentColor"/><path d="M12 22.5V6" stroke="rgba(0,0,0,.25)" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
      <svg class="lf4" viewBox="0 0 24 28"><path d="M12 2l6 12-6 12-6-12 6-12Z" fill="currentColor"/></svg>
      <svg class="lf5" viewBox="0 0 24 28"><path d="M12 3C7 7 4.5 11 5.5 15.5 6.4 19.5 9 21.5 12 22.5c3-1 5.6-3 6.5-7C19.5 11 17 7 12 3Z" fill="currentColor"/><path d="M12 22.5V6" stroke="rgba(0,0,0,.25)" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
      <svg class="lf6" viewBox="0 0 24 28"><path d="M12 2l6 12-6 12-6-12 6-12Z" fill="currentColor"/></svg>
      <svg class="lf7" viewBox="0 0 24 28"><path d="M12 3C7 7 4.5 11 5.5 15.5 6.4 19.5 9 21.5 12 22.5c3-1 5.6-3 6.5-7C19.5 11 17 7 12 3Z" fill="currentColor"/><path d="M12 22.5V6" stroke="rgba(0,0,0,.25)" stroke-width="1.2" fill="none" stroke-linecap="round"/></svg>
    </div>

    <div class="book" aria-hidden="true">
      <div class="page left">
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
      </div>
      <div class="spine"></div>
      <div class="page right">
        <span class="line"></span><span class="line"></span>
        <span class="line"></span><span class="line"></span>
      </div>
    </div>

    <div class="safe">
      <div class="eyebrow">Literary boutique</div>
      <h1>The Books Wanderer</h1>
      <div class="rule"></div>
      <p class="tag">For those who wander between pages.</p>
      <p class="url">thebookswanderer.com</p>
    </div>

    <div class="corner">Reading accessories · worldwide</div>
  </div>
</body>
</html>
