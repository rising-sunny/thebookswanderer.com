name: Discover and invite readers

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-collaborators-vps
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh
      - name: Discover and invite readers (same locked VPS job as cron)
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" \
            "cd $REMOTE/server && runuser -u www-data -- env PYTHONUNBUFFERED=1 .venv/bin/python scripts/run_reader_outreach.py --send"
