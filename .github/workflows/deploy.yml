# Deploy static site + API to the VPS — same steps as deploy/deploy.ps1.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify checkout and supplier integration
        run: |
          python -m pip install -q -r server/requirements.txt
          python - <<'PYTEST'
          import sys, unittest
          sys.path.insert(0, 'server/tests')
          suite = unittest.TestSuite()
          for name in ['test_prodigi_store', 'test_worldwide_shipping', 'test_paypal_recovery', 'test_lulu_submission', 'test_product_schema']:
              suite.addTests(unittest.defaultTestLoader.loadTestsFromName(name))
          result = unittest.TextTestRunner(verbosity=1).run(suite)
          raise SystemExit(not result.wasSuccessful())
          PYTEST

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Directories
        run: ssh -o BatchMode=yes "$VPS_HOST" "mkdir -p $REMOTE/assets/products $REMOTE/server/services $REMOTE/server/routers $REMOTE/server/templates $REMOTE/server/scripts $REMOTE/server/data $REMOTE/deploy"

      - name: Static
        run: |
          scp -o BatchMode=yes \
            index.html styles.css app.js product.html product.js cart.html cart.js \
            checkout.html checkout.js affiliate-data.js pick.html pick.js about.html press.html \
            contact.html privacy.html shipping-returns.html robots.txt sitemap.xml \
            affiliate-products.json track.js i18n.js googleca903f9ea8fb8e9e.html \
            c8e661e720274c3e3e3035210af1a952.txt \
            "$VPS_HOST:$REMOTE/"
          for f in logo.png logo.webp logo-hero.webp logo-email.png og-default.jpg \
                   favicon.ico favicon-32.png favicon-48.png apple-touch-icon.png; do
            if [ -f "assets/$f" ]; then
              scp -o BatchMode=yes "assets/$f" "$VPS_HOST:$REMOTE/assets/"
            fi
          done
          scp -o BatchMode=yes -r guides "$VPS_HOST:$REMOTE/"
          scp -o BatchMode=yes -r reading-challenge-2027 reto-de-lectura-2027 "$VPS_HOST:$REMOTE/"
          if [ -d assets/products ]; then
            scp -o BatchMode=yes -r assets/products/. "$VPS_HOST:$REMOTE/assets/products/"
          fi
          if [ -d assets/pins ]; then
            ssh -o BatchMode=yes "$VPS_HOST" "mkdir -p $REMOTE/assets/pins"
            scp -o BatchMode=yes -r assets/pins/. "$VPS_HOST:$REMOTE/assets/pins/"
          fi
          if [ -d assets/downloads ]; then
            ssh -o BatchMode=yes "$VPS_HOST" "mkdir -p $REMOTE/assets/downloads"
            scp -o BatchMode=yes -r assets/downloads/. "$VPS_HOST:$REMOTE/assets/downloads/"
          fi

      - name: Server
        working-directory: server
        run: |
          scp -o BatchMode=yes main.py database.py models.py requirements.txt .env.example \
            ssr.py urls.py live.py i18n.py "$VPS_HOST:$REMOTE/server/"
          scp -o BatchMode=yes -r i18n "$VPS_HOST:$REMOTE/server/"
          scp -o BatchMode=yes \
            services/__init__.py services/cj.py services/paypal.py services/paypal_recovery.py services/pricing.py \
            services/categories.py services/email.py services/meta_capi.py services/health.py \
            services/pinterest.py services/pinterest_jobs.py services/geo.py services/live_events.py \
            services/printify.py services/digital.py services/lulu.py services/lulu_submission.py \
            services/shipping.py services/countries.py services/prodigi_store.py services/prodigi_submission.py \
            services/collaborators.py services/collaborators_store.py \
            services/invitation.py services/outreach.py services/monthly_newsletter.py \
            "$VPS_HOST:$REMOTE/server/services/"
          scp -o BatchMode=yes routers/__init__.py routers/pinterest.py routers/collaborators.py routers/outreach.py "$VPS_HOST:$REMOTE/server/routers/"
          scp -o BatchMode=yes templates/*.html "$VPS_HOST:$REMOTE/server/templates/"
          scp -o BatchMode=yes scripts/*.py scripts/*.json "$VPS_HOST:$REMOTE/server/scripts/"
          scp -o BatchMode=yes -r social "$VPS_HOST:$REMOTE/server/"

      - name: Prodigi print asset and read-only readiness check
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" "test -s /etc/tbw-prodigi/api_key && install -d -o www-data -g www-data -m 750 /var/lib/tbw-prodigi/artwork"
          scp -o BatchMode=yes server/artwork/prodigi/moonlit-botanicals-12x16-300dpi.jpg "$VPS_HOST:/var/lib/tbw-prodigi/artwork/"
          ssh -o BatchMode=yes "$VPS_HOST" "chown www-data:www-data /var/lib/tbw-prodigi/artwork/*.jpg && chmod 640 /var/lib/tbw-prodigi/artwork/*.jpg && cd $REMOTE/server && PRODIGI_API_KEY_FILE=/etc/tbw-prodigi/api_key PRODIGI_ORDERS_ENABLED=1 .venv/bin/python scripts/publish_prodigi_phyllotaxis.py"

      - name: Setup on VPS
        run: |
          scp -o BatchMode=yes deploy/thebookswanderer.service deploy/tbw-order-tracking.service "$VPS_HOST:/etc/systemd/system/"
          scp -o BatchMode=yes deploy/remote-setup.sh "$VPS_HOST:$REMOTE/deploy/remote-setup.sh"
          ssh -o BatchMode=yes "$VPS_HOST" "sed -i 's/\r\$//' $REMOTE/deploy/remote-setup.sh; bash $REMOTE/deploy/remote-setup.sh"

      - name: Health
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors https://thebookswanderer.com/api/health

      - name: Publish reviewed Prodigi print
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" "cd $REMOTE/server && PRODIGI_API_KEY_FILE=/etc/tbw-prodigi/api_key PRODIGI_ORDERS_ENABLED=1 .venv/bin/python scripts/publish_prodigi_phyllotaxis.py --publish"

      - name: Verify published print
        run: |
          curl -fsS https://thebookswanderer.com/api/products/by-slug/moonlit-botanicals-phyllotaxis-art-print | python3 -c 'import json,sys; p=json.load(sys.stdin); assert p["supplier"]=="prodigi" and p["price_usd"]==44.95 and "mathematical code" in p["description"] and "AI image generator" in p["description"]'
