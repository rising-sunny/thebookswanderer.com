# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Verify book rest publication and remove unused staging photos
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Verify the single new listing and remove only this release's unused staging photos."""
          import hashlib,json,re,shutil,sqlite3,subprocess
          from pathlib import Path
          ROOT=Path.cwd();base=Path('/var/backups/thebookswanderer-products');meta=json.loads((base/'bedside-book-rest-latest.json').read_text());out={}
          spec=json.loads((ROOT/'scripts/bedside_book_rest_product.json').read_text())
          with sqlite3.connect('file:'+meta['database_path']+'?mode=ro',uri=True) as db:
           db.row_factory=sqlite3.Row
           def digest(sql):return hashlib.sha256(json.dumps([dict(r) for r in db.execute(sql)],sort_keys=True).encode()).hexdigest()
           out['other_products_unchanged']=digest("SELECT * FROM products WHERE slug!='bedside-book-rest' ORDER BY id")==meta['other_products_sha256']
           out['other_variants_unchanged']=digest("SELECT v.* FROM product_variants v JOIN products p ON p.id=v.product_id WHERE p.slug!='bedside-book-rest' ORDER BY v.id")==meta['other_variants_sha256']
           p=db.execute("SELECT * FROM products WHERE slug='bedside-book-rest'").fetchone();assert p is not None
           variants=db.execute('SELECT * FROM product_variants WHERE product_id=? AND active=1',(p['id'],)).fetchall()
           out['published_mapping_ok']=(p['active']==1 and p['supplier']=='cj' and p['cj_pid']==spec['pid'] and p['cj_vid']==spec['vid'] and p['cj_sku']==spec['sku'] and p['price_usd']==24.99 and p['from_country']=='CN' and len(variants)==1 and variants[0]['cj_vid']==spec['vid'] and variants[0]['cj_sku']==spec['sku'] and variants[0]['price_usd']==24.99)
           out['product_id']=p['id'];out['variant_id']=variants[0]['id'];out['active_products']=db.execute('SELECT count(*) FROM products WHERE active=1').fetchone()[0]
           out['orders_count']=db.execute('SELECT count(*) FROM orders').fetchone()[0];out['order_items_count']=db.execute('SELECT count(*) FROM order_items').fetchone()[0]
           paths=[p['image_url'],*json.loads(p['gallery_json'])]
           out['only_reviewed_images_used']=paths==[spec['image_url'],*spec['gallery']] and len(paths)==2
           out['copy_has_no_chinese_writing']=not bool(re.search(r'[\u4e00-\u9fff]',p['title']+p['description']+p['details_html']))
           out['publication_report']=json.loads((ROOT/'data/bedside-book-rest-validation.json').read_text())
          out['critical_application_source_preserved']=all(hashlib.sha256((ROOT/n).read_bytes()).hexdigest()==sha for n,sha in meta['unchanged_source_sha256'].items())
          out['server_configuration_unchanged']=hashlib.sha256((ROOT/'.env').read_bytes()).hexdigest()==meta['server_env_sha256']
          out['root_cron_unchanged']=hashlib.sha256(subprocess.run(['crontab','-l'],capture_output=True,check=True).stdout).hexdigest()==meta['root_cron_sha256']
          for k in ('other_products_unchanged','other_variants_unchanged','published_mapping_ok','only_reviewed_images_used','copy_has_no_chinese_writing','critical_application_source_preserved','server_configuration_unchanged','root_cron_unchanged'):
           assert out[k],k+' failed'
          # These two staging directories were created by this release alone. The final
          # manufacturer images now live at main.jpg and detail.jpg and are preserved.
          product_assets=ROOT.parent/'assets/products/bedside-book-rest'
          for name in ('supplier-originals','supplier-extra'):
           target=product_assets/name
           if target.is_symlink():raise RuntimeError('Unexpected staging symlink; cleanup stopped')
           if target.is_dir():shutil.rmtree(target)
          out['unused_staging_photos_removed']=all(not (product_assets/n).exists() for n in ('supplier-originals','supplier-extra'))
          print(json.dumps(out,sort_keys=True))
          PYCODE
