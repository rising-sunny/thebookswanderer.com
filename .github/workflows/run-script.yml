# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Verify deployed Lulu without creating orders
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Post-deploy checks: no job creation, captures, payments or notifications."""
          import asyncio,collections,hashlib,json,os,re,sqlite3,subprocess,sys
          from pathlib import Path
          ROOT=Path('/var/www/thebookswanderer.com/server');sys.path.insert(0,str(ROOT))
          from dotenv import load_dotenv
          load_dotenv(ROOT/'.env',override=True)
          from services import lulu,digital,lulu_submission
          EXPECTED_HASHES={'main.py': 'eee2b6dd130027cc3d3a108a9c9464a344f49e62e5913fdab331ded3bab44480', 'models.py': '27a8e052ea4c4955ac4bb4c3efd3beecd25b368636ec0acbcdf439b2be8f0961', 'database.py': 'dd573931531f297d5492a49767ea7dd64a439dc045463a3c9b5ff5cfe44a8c07', 'services/lulu.py': '9da4201acd090561e602f3729a5161dc694c757e50f03356c35a4d8a434dfb62', 'services/lulu_submission.py': 'd5a847aa9d2019298d04fded8462f50b1c1dd98c643cc0a6e32b8326b52493a5', 'scripts/sync_order_tracking.py': '876fa21ed51c1c9972f2a4238676848e4d318ade1882eecdd660c5c2d41eb9d0', 'scripts/reconcile_lulu_submissions.py': '216941afaa2ff48d96aec6ad2c99f3021322c3f359478f60445461f5e549db7c'}
          out={'source_matches':{name:hashlib.sha256((ROOT/name).read_bytes()).hexdigest()==sha for name,sha in EXPECTED_HASHES.items()}}
          assert all(out['source_matches'].values()),'Deployed source does not match merged release'
          base=Path('/var/backups/thebookswanderer-lulu');meta=json.loads((base/'latest.json').read_text());folder=Path(meta['backup_dir']);out['backup_exists']=(folder/'store.db').is_file() and (folder/'server.env').is_file()
          with sqlite3.connect('file:'+str(folder/'store.db')+'?mode=ro',uri=True) as db:out['backup_integrity']=db.execute('PRAGMA quick_check').fetchone()[0]
          with sqlite3.connect('file:'+meta['database_path']+'?mode=ro',uri=True) as db:
           db.row_factory=sqlite3.Row
           counts={t:db.execute('SELECT count(*) FROM '+t).fetchone()[0] for t in meta['counts']};out['web_counts']=counts;out['existing_counts_preserved']=all(counts[k]>=v for k,v in meta['counts'].items())
           cols=[dict(x) for x in db.execute('PRAGMA table_info(lulu_submissions)')];out['submission_table_exists']=bool(cols);out['submission_order_key_unique']=any(x['name']=='order_id' and x['pk']==1 for x in cols);out['submission_rows']=db.execute('SELECT count(*) FROM lulu_submissions').fetchone()[0]
           mappings=db.execute("SELECT p.slug,p.lulu_package,v.digital_file,v.print_cover FROM products p JOIN product_variants v ON v.product_id=p.id WHERE p.active=1 AND p.supplier='lulu' AND v.active=1").fetchall()
           out['lulu_products']=len({x['slug'] for x in mappings});out['lulu_variants']=len(mappings);out['all_print_files_present']=all(x['lulu_package'] and digital.file_path(x['digital_file']) and digital.file_path(x['print_cover']) for x in mappings)
           first_print=mappings[0]['digital_file'] if mappings else None
          assert out['submission_table_exists'] and out['submission_order_key_unique'] and out['all_print_files_present'] and out['existing_counts_preserved']
          cp=Path('/opt/etsy_lulu_fulfill/lulu_books/unified/config.json');cfg=json.loads(cp.read_text());files={'config':cp,'catalog':Path(cfg['catalog_path']),'worker':cp.parent/'worker.py','core':cp.parent/'core.py'}
          out['etsy_files_unchanged']={k:hashlib.sha256(p.read_bytes()).hexdigest()==meta['etsy_static_sha256'][k] for k,p in files.items()}
          cron=subprocess.run(['crontab','-l'],capture_output=True,text=True,check=True).stdout;out['root_cron_unchanged']=hashlib.sha256(cron.encode()).hexdigest()==meta['root_cron_sha256'];out['manual_payment_record_preserved']=cfg.get('settings',{}).get('manual_payment_confirmed') is True;out['etsy_tracking_still_unapproved']=cfg.get('settings',{}).get('etsy_tracking_approved') is False
          assert all(out['etsy_files_unchanged'].values()) and out['root_cron_unchanged'] and out['manual_payment_record_preserved'] and out['etsy_tracking_still_unapproved']
          # Exercise only pure validation functions in memory, without submitting an address.
          normalized=lambda value:re.sub(r'[^0-9+]','',str(value or ''))
          phone=normalized(os.getenv('LULU_MERCHANT_PHONE'));out['phone_matches_authorized_business_contact']=bool(phone) and phone==normalized(cfg['settings'].get('merchant_phone'))
          a=lulu.address('Configuration check','1 Verification Street','','Verification','NY','US','10001','');out['omitted_phone_uses_configured_fallback']=a['phone_number']==phone
          try:lulu.address('Configuration check','1 Verification Street','','Verification','NY','US','10001','invalid')
          except lulu.LuluError:out['invalid_phone_rejected']=True
          else:out['invalid_phone_rejected']=False
          assert out['phone_matches_authorized_business_contact'] and out['omitted_phone_uses_configured_fallback'] and out['invalid_phone_rejected']
          out['service_active']=subprocess.run(['systemctl','is-active','thebookswanderer.service'],capture_output=True,text=True).stdout.strip()=='active'
          # Run the deployed report with the application's normal user and configuration.
          r=subprocess.run(['runuser','-u','www-data','--','.venv/bin/python','scripts/reconcile_lulu_submissions.py'],cwd=ROOT,capture_output=True,text=True,timeout=120)
          if r.returncode:raise RuntimeError('Read-only reconciliation report failed; no response bodies emitted')
          out['reconciliation']=json.loads(r.stdout);assert out['reconciliation']['applied']==0
          async def main():
           import httpx
           d=await lulu.request('GET','/print-jobs/?page_size=100')
           out['lulu_read_access']=True;out['visible_lulu_jobs']=d.get('count');out['lulu_status_counts']=dict(collections.Counter((x.get('status') or {}).get('name','unknown') for x in d.get('results',[])))
           async with httpx.AsyncClient(timeout=45,follow_redirects=False) as c:
            r=await c.get('https://thebookswanderer.com/api/health');out['web_healthy']=r.status_code==200 and r.json().get('ok') is True
            if first_print:
             r=await c.get(lulu.file_url('https://thebookswanderer.com',first_print));out['signed_pdf_access_ok']=r.status_code==200 and r.content.startswith(b'%PDF-')
             r=await c.get('https://thebookswanderer.com/api/print-files/'+first_print);out['unsigned_pdf_still_protected']=r.status_code==404
           assert out['web_healthy'] and out['service_active'] and out['signed_pdf_access_ok'] and out['unsigned_pdf_still_protected']
           print(json.dumps(out,indent=2))
          asyncio.run(main())
          PYCODE
