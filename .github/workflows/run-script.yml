# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Read-only Lulu audit
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Read-only diagnostic. No checkout, worker execution, payments or notifications."""
          import ast,collections,json,re,shlex,subprocess
          from pathlib import Path
          out={};cron=subprocess.run(['crontab','-l'],capture_output=True,text=True).stdout
          entries=[]
          for line in cron.splitlines():
           if '/unified/worker.py' in line and not line.lstrip().startswith('#'):
            entries.append({'tokens':[t if t in ('*','*/15','/usr/bin/python3','check','--config','>>','>','2>&1') or (t.startswith('/') and re.fullmatch(r'[/a-zA-Z0-9_.-]+',t)) else '<other>' for t in shlex.split(line)],'literal_backslash_n':r'\n' in line})
          out['unified_cron_entries']=entries
          root=Path('/opt/etsy_lulu_fulfill/lulu_books/unified')
          for name in ('worker.py','core.py'):
           tree=ast.parse((root/name).read_text());out[name]={'functions':[n.name for n in tree.body if isinstance(n,(ast.FunctionDef,ast.AsyncFunctionDef))]}
           for n in ast.walk(tree):
            if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute) and n.func.attr in ('add_argument','FileHandler'):
             strings=[x.value for x in n.args if isinstance(x,ast.Constant) and isinstance(x.value,str)];out[name].setdefault(n.func.attr,[]).append(strings)
          for dirname in ('/var/lib/mathrelaxing-etsy-lulu','/root/lulu-unificado'):
           p=Path(dirname);out[dirname]={'exists':p.exists(),'log_files':[str(x) for x in p.glob('*.log')] if p.is_dir() else []}
          log=Path('/var/log/syslog')
          if log.exists():
           # Never print system log lines; retain only cycle counts and safe exception class names.
           lines=log.read_text(errors='replace').splitlines()[-25000:];ours=[l for l in lines if '/unified/worker.py' in l]
           out['syslog']={'unified_cron_commands':len(ours),'recent_timestamps':[l[:19] for l in ours[-5:]]}
          print(json.dumps(out,indent=2))
          PYCODE
