# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Back up store before worldwide shipping release
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          import json,os,sqlite3
          from datetime import datetime,timezone
          from pathlib import Path
          from dotenv import dotenv_values
          root=Path('/var/www/thebookswanderer.com/server');env=dotenv_values(root/'.env')
          u=env.get('DATABASE_URL') or 'sqlite:///'+str(root/'data/store.db');assert u.startswith('sqlite:///')
          p=Path(u[len('sqlite:///'):]);p=p if p.is_absolute() else root/p
          folder=Path('/var/backups/thebookswanderer-worldwide-shipping')/datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ');folder.mkdir(parents=True,mode=0o700);os.chmod(folder.parent,0o700)
          source=sqlite3.connect('file:'+str(p)+'?mode=ro',uri=True)
          target=sqlite3.connect(folder/'store.db');source.backup(target);target.close();os.chmod(folder/'store.db',0o600)
          print(json.dumps({'worldwide_predeploy_backup':True,'private_backup_path':str(folder/'store.db'),'active_products':source.execute('select count(*) from products where active=1').fetchone()[0],'orders':source.execute('select count(*) from orders').fetchone()[0],'standard_us_shipping_included':(env.get('FREE_SHIPPING') or '1').lower() in ('1','true','yes','on'),'orders_created':0}))
          source.close()
          PYCODE
