# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Read-only Lulu audit
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Read-only diagnostic. No checkout, worker execution, payments or notifications."""
          import ast,json,re,subprocess
          from pathlib import Path
          root=Path('/opt/etsy_lulu_fulfill/lulu_books/unified');cfg=json.loads((root/'config.json').read_text());cat=json.loads(Path(cfg['catalog_path']).read_text());books=cat.get('books',{});rows=list(books.values()) if isinstance(books,dict) else books
          out={'catalog_rows':len(rows),'enabled_rows':sum(bool(x.get('enabled')) for x in rows),'disabled_rows':sum(not x.get('enabled') for x in rows)}
          if isinstance(books,dict):v=books.get('4533709063',{})
          else:v=next((x for x in rows if str(x.get('listing_id'))=='4533709063'),{})
          out['voronoi']={'found':bool(v),'enabled':v.get('enabled'),'intentionally_disabled':v.get('intentionally_disabled')}
          text=(root/'worker.py').read_text();tree=ast.parse(text);out['worker_print_call_count']=sum(isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='print' for n in ast.walk(tree))
          ps=subprocess.run(['ps','-eo','args='],capture_output=True,text=True).stdout;out['active_unified_worker_processes']=sum('/unified/worker.py' in x for x in ps.splitlines())
          log=Path('/var/lib/mathrelaxing-etsy-lulu/worker.log');txt=log.read_text(errors='replace') if log.exists() else '';out['worker_log']={'exists':log.exists(),'bytes':len(txt.encode()),'traceback': 'Traceback' in txt,'error_class_count':len(re.findall(r'\b\w+Error:',txt))}
          # Identify what the worker does with a normal CLI result without exposing config.
          for fn in tree.body:
           if isinstance(fn,ast.FunctionDef) and fn.name=='main':
            out['worker_main_call_names']=sorted({n.func.attr if isinstance(n.func,ast.Attribute) else n.func.id for n in ast.walk(fn) if isinstance(n,ast.Call) and isinstance(n.func,(ast.Name,ast.Attribute))})
          print(json.dumps(out,indent=2))
          PYCODE
