# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Inspect existing pixel grants and managed assets using read-only requests
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Read-only discovery of existing pixel/account grants with existing tokens."""
          import json,re
          import httpx
          from dotenv import dotenv_values
          cfg=dotenv_values('/root/vps_x_bot/.env');env=dotenv_values('/var/www/thebookswanderer.com/server/.env')
          tokens={'user':cfg['FACEBOOK_USER_ACCESS_TOKEN'],'existing_capi':env['META_CAPI_TOKEN']}
          v=(cfg.get('FACEBOOK_GRAPH_API_VERSION') or '').strip();BASE='https://graph.facebook.com/'+(v+'/' if re.fullmatch(r'v[0-9]+\.[0-9]+',v) else '')
          pixel=env['META_PIXEL_ID'];out={'pixel_access_discovery':True,'write_requests':0,'credential_values_disclosed':False}
          def get(c,path,params=None):
           try:
            r=c.get(BASE+path,params=params or {});j=r.json()
            if not r.is_success or j.get('error'):
             e=j.get('error') or {};msg=str(e.get('message',''))
             for t in tokens.values():msg=msg.replace(t,'[redacted]')
             msg=re.sub(r'https?://\S+|EAA[A-Za-z0-9]{20,}','[redacted]',msg)
             return {'error':{'code':e.get('code'),'subcode':e.get('error_subcode'),'message':msg[:250]}}
            if 'paging' in j:return {'data':j.get('data',[]),'has_more':bool(j['paging'].get('next'))}
            return j
           except Exception as e:return {'error_type':type(e).__name__}
          for label,token in tokens.items():
           with httpx.Client(headers={'Authorization':'Bearer '+token},timeout=25) as c:
            part={}
            part['pixel_identity']=get(c,pixel,{'fields':'id,name,is_created_by_business'})
            part['pixel_owner_reference']=get(c,pixel,{'fields':'owner_ad_account'})
            part['selected_account_pixel_list']=get(c,'act_2206299143461363/adspixels',{'fields':'id,name','limit':100})
            if label=='user':
             part['managed_accounts']=get(c,'me/adaccounts',{'fields':'id,name,currency,account_status,business{id,name}','limit':100})
             businesses=get(c,'me/businesses',{'fields':'id,name','limit':100});part['businesses']=businesses
             matches=[]
             for b in businesses.get('data',[])[:8]:
              for edge in ['owned_pixels','client_pixels']:
               pixels=get(c,b['id']+'/'+edge,{'fields':'id,name','limit':100})
               matching=[p for p in pixels.get('data',[]) if p.get('id')==pixel]
               if matching:matches.append({'business':b,'edge':edge,'matching_pixels':matching})
             part['pixel_business_matches']=matches
            else:part['permissions']=get(c,'me/permissions')
            out[label]=part
          print(json.dumps(out,sort_keys=True))
          PYCODE
