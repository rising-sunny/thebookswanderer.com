# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Check new product autonomous social eligibility read only
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Read-only eligibility and scheduler check. No rendering or social/email sends."""
          import json,os,shutil,subprocess,sys
          from pathlib import Path
          from datetime import datetime
          from dotenv import load_dotenv
          ROOT=Path.cwd();load_dotenv(ROOT/'.env');sys.path.insert(0,str(ROOT/'scripts'))
          import daily_social_post as social
          from database import SessionLocal
          from models import Product
          from services import pinterest as pin,pinterest_jobs as jobs
          import httpx
          SLUG='bedside-book-rest'
          with httpx.Client(timeout=30) as c:
           state=social.load_state();chosen=social.pick_product(c,state,None)
           p=c.get(social.BASE+'/api/products/by-slug/'+SLUG);p.raise_for_status();product=p.json()
          media=list(dict.fromkeys([product['image_url'],*product.get('lifestyle_images',[]),*[v.get('image_url') for v in product.get('variants',[])]]))
          out={'product_active':True,'product_id':product['id'],'social_enabled':(os.getenv('SOCIAL_POST_ENABLED','1') or '').strip()!='0','facebook_credentials_configured':bool(os.getenv('FB_PAGE_ID') and os.getenv('FB_PAGE_TOKEN')),'ffmpeg_available':bool(shutil.which('ffmpeg')),'next_selected_product':chosen['slug'],'new_product_is_next_candidate':chosen['slug']==SLUG,'social_photos':media,'new_product_history':[{'date':e.get('date'),'facebook_posted':bool(e.get('facebook')),'instagram_posted':bool(e.get('instagram')),'pinterest_attempted':bool(e.get('pinterest')),'ok':bool(e.get('ok'))} for e in state if e.get('slug')==SLUG]}
          with SessionLocal() as db:
           candidates=jobs.select_drip_candidates(db,limit=1000)
           out['pinterest_eligible']=any(p.slug==SLUG for p in candidates)
           out['pinterest_auto_enabled']=jobs.auto_pin_enabled();out['pinterest_configured']=pin.is_configured()
           health=pin.token_health();out['pinterest_token_connected']=health.get('connected');out['pinterest_reauth_required']=health.get('reauth_required')
           out['pinterest_board_configured']=bool(jobs.board_id_for_category(product.get('category_slug')))
           out['last_pin_for_product']=jobs.last_successful_pin_at(db,SLUG).isoformat() if jobs.last_successful_pin_at(db,SLUG) else None
          cron_text=[]
          r=subprocess.run(['crontab','-l'],capture_output=True,text=True)
          if r.returncode==0:cron_text.append(('root',r.stdout))
          for file in Path('/etc/cron.d').iterdir():
           if file.is_file():cron_text.append((file.name,file.read_text(errors='replace')))
          entries=[]
          for source,content in cron_text:
           for line in content.splitlines():
            line=line.strip()
            if not line or line.startswith('#'):continue
            for script in ('daily_social_post.py','pinterest_auto_pin.py'):
             if script in line:entries.append({'source':source,'schedule':' '.join(line.split()[:5]),'script':script})
          out['cron_entries']=entries
          out['cron_service_active']=subprocess.run(['systemctl','is-active','cron'],capture_output=True,text=True).stdout.strip()=='active'
          now=datetime.now(social.NY);out['checked_at_new_york']=now.isoformat(timespec='seconds');out['today_already_posted']=any(e.get('date')==now.date().isoformat() and e.get('ok') for e in state)
          out['new_posts_sent_by_audit']=0
          print(json.dumps(out,sort_keys=True))
          PYCODE
