# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: run-script-vps
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate input
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          [[ "$SCRIPT" =~ ^[a-z0-9_]+\.py$ ]] || { echo "invalid script name"; exit 1; }
          [ -f "server/scripts/$SCRIPT" ] || { echo "no such script in the repo"; exit 1; }

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Diagnose authorized Pinterest description update
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && runuser -u www-data -- env PYTHONUNBUFFERED=1 .venv/bin/python -' <<'PYCODE'
          import asyncio,json
          from pathlib import Path
          from dotenv import load_dotenv
          load_dotenv(Path.cwd()/'.env')
          from services import pinterest as pin
          from database import SessionLocal
          from models import Product
          from scripts.repair_marketing_pins import corrected_description
          async def main():
              pid='1098948746610883647'
              with SessionLocal() as db:
                  product=db.query(Product).filter_by(slug='commonplace-book').one().to_public()
              live=await pin.api_request('GET','/pins/'+pid)
              wanted=corrected_description(live.get('description') or '',product)
              try:
                  await pin.api_request('PATCH','/pins/'+pid,json={'description':wanted})
                  print(json.dumps({'updated':pid}))
              except Exception as e:
                  try: detail=json.loads(getattr(e,'detail','{}'))
                  except (ValueError,TypeError):detail={}
                  print(json.dumps({'status':getattr(e,'status_code',None),'error_type':type(e).__name__,'code':detail.get('code'),'message':str(detail.get('message',''))[:400]}))
          asyncio.run(main())
          PYCODE
