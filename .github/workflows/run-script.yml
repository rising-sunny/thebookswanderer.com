# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: run-script-vps
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Validate input
        env:
          SCRIPT: ${{ inputs.script }}
        run: |
          [[ "$SCRIPT" =~ ^[a-z0-9_]+\.py$ ]] || { echo "invalid script name"; exit 1; }
          [ -f "server/scripts/$SCRIPT" ] || { echo "no such script in the repo"; exit 1; }

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Inspect installed schedules (read only)
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'python3 -' <<'PYCODE'
          import json,re,subprocess
          from pathlib import Path
          def show(source,lines):
              for line in lines:
                  line=line.strip()
                  if not line or line.startswith('#') or not re.search(r'tbw|thebookswanderer|pinterest|daily_social|welcome_series',line,re.I):continue
                  scripts=re.findall(r'(?:[A-Za-z0-9_-]+\.py|[A-Za-z0-9_-]+\.sh)',line)
                  schedule=' '.join(line.split()[:5])
                  print(json.dumps({'schedule_source':source,'schedule':schedule,'scripts':scripts}))
          for user in ['root','www-data']:
              result=subprocess.run(['crontab','-u',user,'-l'],capture_output=True,text=True)
              show('crontab:'+user,result.stdout.splitlines())
          for folder in [Path('/etc/cron.d')]:
              for path in sorted(folder.iterdir()):
                  if path.is_file():show(str(path),path.read_text(errors='replace').splitlines())
          print(json.dumps({'cron_service':subprocess.run(['systemctl','is-active','cron'],capture_output=True,text=True).stdout.strip()}))
          PYCODE

      - name: Audit automation state and remote APIs (read only)
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && runuser -u www-data -- env PYTHONUNBUFFERED=1 .venv/bin/python -' < server/scripts/audit_automations.py
