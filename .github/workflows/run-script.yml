# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Read-only Lulu audit
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Read-only diagnostic. No checkout, worker execution, payments or notifications."""
          import collections,json,re
          from pathlib import Path
          p=Path('/var/lib/mathrelaxing-etsy-lulu/worker.log');out={'log_exists':p.is_file()}
          if p.is_file():
           text=p.read_text(errors='replace');out['bytes']=len(text.encode());out['traceback_present']='Traceback' in text;out['exception_types']=sorted(set(re.findall(r'\b([A-Z][A-Za-z]*(?:Error|Exception)):',text)));out['timestamps']=re.findall(r'\d{4}-\d\d-\d\d[T ]\d\d:\d\d(?::\d\d)?',text)[-6:]
           # Worker summaries contain counts/booleans, but receipt ids and payloads must stay private.
           summary=[];allowed={'checked','created','skipped','held','pending','errors','submitted','processed','ok','dry_run','create_jobs_enabled','count','scanned','seen','eligible','duplicates','would_create','legacy_skipped','jobs_created'}
           for line in text.splitlines():
            try:d=json.loads(line)
            except ValueError:continue
            if isinstance(d,dict):
             x={k:(len(v) if isinstance(v,(dict,list)) else v) for k,v in d.items() if k in allowed and isinstance(v,(bool,int,float,list,dict))};x['field_count']=len(d);summary.append(x)
           out['structured_summaries']=summary[-6:]
          state=Path('/var/lib/mathrelaxing-etsy-lulu/state.json')
          if state.exists():
           s=json.loads(state.read_text());out['preserved_history_counts']={k:len(v) for k,v in s.items() if k in ('receipts','legacy_blocked_receipts','legacy_jobs') and isinstance(v,(list,dict))}
          print(json.dumps(out,indent=2))
          PYCODE
