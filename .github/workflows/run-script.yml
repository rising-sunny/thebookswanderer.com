# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Back up store before bedside book rest publication
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Private consistent backup before the authorized single-product publication."""
          import hashlib,json,os,sqlite3,subprocess
          from datetime import datetime,timezone
          from pathlib import Path
          from dotenv import load_dotenv
          ROOT=Path.cwd();load_dotenv(ROOT/'.env')
          os.umask(0o077);base=Path('/var/backups/thebookswanderer-products');base.mkdir(parents=True,exist_ok=True,mode=0o700);os.chmod(base,0o700)
          folder=base/('bedside-book-rest-'+datetime.now(timezone.utc).strftime('%Y%m%dT%H%M%SZ'));folder.mkdir(mode=0o700)
          url=os.getenv('DATABASE_URL') or 'sqlite:///'+str(ROOT/'data/store.db')
          if not url.startswith('sqlite:///'):raise RuntimeError('Unexpected database backend; no writes made')
          dbpath=Path(url[10:]);dbpath=dbpath if dbpath.is_absolute() else ROOT/dbpath
          with sqlite3.connect('file:'+str(dbpath)+'?mode=ro',uri=True) as source,sqlite3.connect(folder/'store.db') as target:
           source.backup(target);assert target.execute('PRAGMA quick_check').fetchone()[0]=='ok'
           target.row_factory=sqlite3.Row
           counts={t:target.execute('SELECT count(*) FROM '+t).fetchone()[0] for t in ('products','product_variants','orders','order_items','lulu_submissions')}
           def digest(sql):return hashlib.sha256(json.dumps([dict(r) for r in target.execute(sql)],sort_keys=True).encode()).hexdigest()
           p_hash=digest("SELECT * FROM products WHERE slug!='bedside-book-rest' ORDER BY id")
           v_hash=digest("SELECT v.* FROM product_variants v JOIN products p ON p.id=v.product_id WHERE p.slug!='bedside-book-rest' ORDER BY v.id")
          cron=subprocess.run(['crontab','-l'],capture_output=True,check=True).stdout
          files=['main.py','models.py','database.py','services/paypal.py','services/paypal_recovery.py','services/lulu_submission.py','scripts/sync_order_tracking.py']
          meta={'backup_dir':str(folder),'database_path':str(dbpath),'counts':counts,'other_products_sha256':p_hash,'other_variants_sha256':v_hash,'root_cron_sha256':hashlib.sha256(cron).hexdigest(),'server_env_sha256':hashlib.sha256((ROOT/'.env').read_bytes()).hexdigest(),'unchanged_source_sha256':{n:hashlib.sha256((ROOT/n).read_bytes()).hexdigest() for n in files}}
          (folder/'manifest.json').write_text(json.dumps(meta,indent=2));(base/'bedside-book-rest-latest.json').write_text(json.dumps(meta,indent=2))
          print(json.dumps({'private_backup_ready':True,'database_integrity_ok':True,'counts':counts,'configuration_changed':False,'orders_created':0}))
          PYCODE
