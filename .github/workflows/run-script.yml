# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Read-only Lulu audit
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Read-only diagnostic. No checkout, worker execution, payments or notifications."""
          import ast,json
          from pathlib import Path
          p=Path('/opt/etsy_lulu_fulfill/lulu_books/unified/worker.py');tree=ast.parse(p.read_text())
          allowed={'__main__','check','track','validate','command','--config','create_jobs_enabled','manual_payment_confirmed','state_dir','.lock','r','w','utf-8'}
          class Redact(ast.NodeTransformer):
           def visit_Constant(self,n):
            if isinstance(n.value,str) and n.value not in allowed:return ast.copy_location(ast.Constant('<literal>'),n)
            return n
          out={'module_statement_types':[type(n).__name__ for n in tree.body],'module_main_guard':any(isinstance(n,ast.If) and '__name__' in ast.unparse(n.test) for n in tree.body)}
          for n in tree.body:
           if isinstance(n,ast.If) and '__name__' in ast.unparse(n.test):out['entrypoint']=ast.unparse(Redact().visit(n))
           if isinstance(n,ast.FunctionDef) and n.name in ('main','run'):out[n.name]=ast.unparse(Redact().visit(n))
          print(json.dumps(out,indent=2))
          PYCODE
