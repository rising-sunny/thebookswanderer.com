# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Clarify pixel ownership and existing campaign budget metadata without writes
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Read-only clarification of pixel linkage and concurrent ad budgets."""
          import concurrent.futures,json,re
          from pathlib import Path
          import httpx
          from dotenv import dotenv_values
          env=dotenv_values('/var/www/thebookswanderer.com/server/.env');cfg=dotenv_values('/root/vps_x_bot/.env')
          token=cfg['FACEBOOK_USER_ACCESS_TOKEN'];v=(cfg.get('FACEBOOK_GRAPH_API_VERSION') or '').strip()
          BASE='https://graph.facebook.com/'+(v+'/' if re.fullmatch(r'v[0-9]+\.[0-9]+',v) else '')
          pixel=env['META_PIXEL_ID']
          qs={
           'pixel_owner_account':(pixel,{'fields':'id,name,owner_ad_account{id,name}'}),
           'other_account':('act_1696378237957660',{'fields':'id,name,currency,account_status'}),
           'other_account_pixels':('act_1696378237957660/adspixels',{'fields':'id,name','limit':100}),
           'other_campaign_budget':('120249344610600244',{'fields':'id,name,status,daily_budget,lifetime_budget'}),
           'other_campaign_adsets':('120249344610600244/adsets',{'fields':'id,name,status,daily_budget,lifetime_budget,optimization_goal,promoted_object','limit':100}),
           'pixel_stats_source':(pixel+'/stats',{'aggregation':'source','limit':5}),
          }
          def get(c,path,params):
           try:
            r=c.get(BASE+path,params=params);j=r.json()
            if not r.is_success or j.get('error'):
             e=j.get('error') or {};msg=str(e.get('message') or '').replace(token,'[redacted]')
             msg=re.sub(r'https?://\S+|EAA[A-Za-z0-9]{20,}','[redacted]',msg)
             return {'error':{'code':e.get('code'),'subcode':e.get('error_subcode'),'message':msg[:240]}}
            if 'paging' in j:return {'data':j.get('data',[]),'has_more':bool(j['paging'].get('next'))}
            return j
           except Exception as e:return {'error_type':type(e).__name__}
          out={'meta_asset_details':True,'ad_changes':0,'credential_values_disclosed':False}
          with httpx.Client(headers={'Authorization':'Bearer '+token},timeout=30) as c:
           with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
            fs={pool.submit(get,c,*q):k for k,q in qs.items()}
            for f in concurrent.futures.as_completed(fs):out[fs[f]]=f.result()
          print(json.dumps(out,sort_keys=True))
          PYCODE
