# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Read-only India traffic verification
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          import json,sqlite3
          from pathlib import Path
          from datetime import datetime,timedelta,timezone
          from dotenv import dotenv_values
          root=Path('/var/www/thebookswanderer.com/server')
          env=dotenv_values(root/'.env')
          u=env.get('DATABASE_URL') or 'sqlite:///'+str(root/'data/store.db')
          assert u.startswith('sqlite:///')
          p=Path(u[len('sqlite:///'):]);p=p if p.is_absolute() else root/p
          c=sqlite3.connect('file:'+str(p)+'?mode=ro',uri=True);c.row_factory=sqlite3.Row
          now=datetime.now(timezone.utc);since=(now-timedelta(days=30)).strftime('%Y-%m-%d %H:%M:%S')
          def q(sql,args=()):return [dict(r) for r in c.execute(sql,args)]
          base=" FROM live_events WHERE country='IN' AND ts>=? "
          human=" AND COALESCE(ua_class,'') NOT IN ('server','datacenter','bot') "
          r={'india_traffic_audit':True,'checked_at_utc':now.isoformat(),'window_start_utc':since,
          'all_30d':q('SELECT count(*) events,count(distinct session_id) sessions,min(ts) first_seen_utc,max(ts) last_seen_utc'+base,(since,)),
          'classification':q('SELECT ua_class,count(*) events,count(distinct session_id) sessions'+base+'GROUP BY ua_class',(since,)),
          'days':q('SELECT substr(ts,1,10) day_utc,count(distinct session_id) sessions'+base+human+'GROUP BY 1 ORDER BY 1',(since,)),
          'events':q('SELECT event_type,count(*) events,count(distinct session_id) sessions'+base+human+'GROUP BY 1',(since,)),
          'sources':q("SELECT COALESCE(NULLIF(source,''),NULLIF(referrer_domain,''),'direct/unknown') source,COALESCE(medium,'') medium,COALESCE(campaign,'') campaign,count(distinct session_id) sessions"+base+human+'GROUP BY 1,2,3 ORDER BY sessions DESC',(since,)),
          'product_views':q("SELECT product_slug,count(*) events,count(distinct session_id) sessions"+base+human+"AND event_type='product_view' GROUP BY 1",(since,)),
          'all_today':q('SELECT ua_class,count(distinct session_id) sessions'+base+'GROUP BY 1',(now.strftime('%Y-%m-%d 00:00:00'),))}
          print(json.dumps(r,sort_keys=True));c.close()
          PYCODE
