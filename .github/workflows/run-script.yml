# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Import original media for bedside book rest
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Import the selected CJ product's original media for its authorized listing."""
          import asyncio,json,sys
          from pathlib import Path
          from dotenv import load_dotenv
          ROOT=Path.cwd();load_dotenv(ROOT/'.env');sys.path.insert(0,str(ROOT/'scripts'))
          from services import cj
          import publish_usb_reading_light as media
          PID='2605290228151629500';VID='2605290228161620200';SKU='CJYD291394201AZ'
          async def main():
           details=await cj.get_product_details(pid=PID)
           selected=next((v for v in details.get('variants',[]) if v.get('vid')==VID and v.get('variantSku')==SKU and v.get('variantKey')=='Wood Color'),None)
           if not selected or details.get('pid')!=PID:raise RuntimeError('Selected book rest changed; no media imported')
           media.ASSETS=ROOT.parent/'assets/products/bedside-book-rest/supplier-originals'
           imported=await media.import_assets(details,selected)
           manifest={'pid':PID,'vid':VID,'sku':SKU,'images':imported}
           (ROOT/'data/bedside-book-rest-assets.json').write_text(json.dumps(manifest,indent=2))
           print(json.dumps({'original_images':[{**i,'url':'https://thebookswanderer.com/assets/products/bedside-book-rest/supplier-originals/'+i['filename']} for i in imported],'product_activated':False,'orders_created':0}))
          asyncio.run(main())
          PYCODE
