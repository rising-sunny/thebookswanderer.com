# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Preflight worldwide shipping quotes without orders
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          import asyncio,base64,json,sys,types,sqlite3
          from pathlib import Path
          from dotenv import load_dotenv,dotenv_values
          ROOT=Path('/var/www/thebookswanderer.com/server');sys.path.insert(0,str(ROOT));load_dotenv(ROOT/'.env')
          SOURCES={'countries': '', 'printify': '', 'shipping': ''}
          mods={}
          for name in ('countries','printify','shipping'):
           mod=types.ModuleType('services.'+name) if name=='countries' else types.ModuleType('probe_'+name)
           if name=='countries':sys.modules['services.countries']=mod
           exec(compile(base64.b64decode(SOURCES[name]),'probe_'+name+'.py','exec'),mod.__dict__);mods[name]=mod
          sh=mods['shipping'];sh.printify=mods['printify']
          pages={'commonplace-book':160,'book-club-companion':100,'the-lost-manuscript':96,'reading-passport-printed':40,'reading-passport-hardcover':40,'color-the-classics-printed':60}
          sh.lulu_line=lambda p,v,q:{'pod_package_id':p.lulu_package,'page_count':pages[p.slug],'quantity':q}
          from database import SessionLocal
          from models import Product
          results=[]
          async def main():
           with SessionLocal() as db:
            for slug,country in [('commonplace-book','IN'),('commonplace-book','US'),('reading-society-tote','IN'),('reading-society-tote','GB'),('bedside-book-rest','IN'),('baker-street-book-nook-kit','IN'),('letters-from-the-library','IN')]:
             p=db.query(Product).filter_by(slug=slug).one();v=p.active_variants()[0]
             a={'IN':{'street1':'India Gate','city':'New Delhi','state':'DL','postcode':'110001','phone_number':'+919000000000'},'US':{'street1':'101 Independence Ave SE','city':'Washington','state':'DC','postcode':'20540','phone_number':'+12025550100'},'GB':{'street1':'British Library','city':'London','postcode':'NW1 2DB','phone_number':'+442079714444'}}[country]
             row={'slug':slug,'country':country}
             try:row['quote']=await sh.quote([(p,v,1)],country,a,free_us=True)
             except sh.QuoteError as e:row.update(error=str(e),reason=e.reason,status=e.status)
             except Exception as e:row['error_type']=type(e).__name__
             results.append(row)
           print(json.dumps({'worldwide_shipping_preflight':True,'orders_created':0,'payments_made':0,'results':results},sort_keys=True))
          asyncio.run(main())
          PYCODE
