# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Read ad account status and delivery diagnostics without changing billing
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          """Read-only explanation of the unexpected ad-account status; no payments."""
          import json,re
          from dotenv import dotenv_values
          import httpx
          cfg=dotenv_values('/root/vps_x_bot/.env')
          version=(cfg.get('FACEBOOK_GRAPH_API_VERSION') or '').strip()
          prefix=version+'/' if re.fullmatch(r'v[0-9]+\.[0-9]+',version) else ''
          out={'meta_account_status_check':True,'credential_values_disclosed':False,'write_requests_made':0}
          try:
              with httpx.Client(timeout=25,headers={'Authorization':'Bearer '+cfg['FACEBOOK_USER_ACCESS_TOKEN']}) as c:
                  r=c.get('https://graph.facebook.com/'+prefix+'act_2206299143461363',params={'fields':'account_status,disable_reason,failed_delivery_checks,balance,currency'})
                  j=r.json()
                  if r.is_success and not j.get('error'):
                      out['account_status']=j.get('account_status');out['disable_reason']=j.get('disable_reason')
                      out['currency']=j.get('currency')
                      try:out['positive_outstanding_balance']=int(j.get('balance') or '0')>0
                      except (ValueError,TypeError):out['positive_outstanding_balance']=None
                      checks=j.get('failed_delivery_checks') or []
                      out['failed_delivery_checks']=[{k:x[k] for k in ('check_name','summary','description','error_code') if k in x} for x in checks if isinstance(x,dict)]
                  else:out['error']={'http_status':r.status_code,'code':j.get('error',{}).get('code')}
          except Exception as e:out['error_type']=type(e).__name__
          print(json.dumps(out,sort_keys=True))
          PYCODE
