# Run one of server/scripts/*.py on the VPS (as www-data, with the live .env).
# Deploy first: this runs the copy already on the server, not the branch.
name: Run server script

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in server/scripts, e.g. import_christmas_gifts.py"
        required: true
      args:
        description: "Arguments, e.g. --dry-run"
        required: false
        default: ""

concurrency:
  group: lulu-readonly-audit
  cancel-in-progress: false

env:
  VPS_HOST: root@5.78.125.169
  REMOTE: /var/www/thebookswanderer.com

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: SSH key
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/ci-ssh-setup.sh

      - name: Audit PayPal webhooks read only
        run: |
          ssh -o BatchMode=yes "$VPS_HOST" 'cd /var/www/thebookswanderer.com/server && .venv/bin/python -' <<'PYCODE'
          import asyncio,json,os
          from pathlib import Path
          from dotenv import load_dotenv
          load_dotenv(Path.cwd()/'.env')
          from services import paypal
          import httpx
          async def main():
           token=await paypal._get_access_token()
           async with httpx.AsyncClient(timeout=20) as c:
            r=await c.get(paypal.BASE_URL+'/v1/notifications/webhooks',headers={'Authorization':'Bearer '+token})
            r.raise_for_status()
            configured=os.getenv('PAYPAL_WEBHOOK_ID','')
            hooks=[{'url':h.get('url'),'matches_configured_id':h.get('id')==configured,'events':[e['name'] for e in h.get('event_types',[])]} for h in r.json().get('webhooks',[])]
           print(json.dumps({'mode':paypal.PAYPAL_MODE,'credentials_work':True,'webhook_id_configured':bool(configured),'hooks':hooks}))
          asyncio.run(main())
          PYCODE
