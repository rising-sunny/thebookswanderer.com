# Sonda de disponibilidad externa.
#
# Por que existe: en septiembre de 2026 nginx estuvo caido tres dias y nadie
# lo supo. Un monitor dentro del servidor no puede detectar eso — cuando el
# servidor cae, el monitor cae con el. Esta sonda corre en GitHub, fuera.
#
# Que hace cada 30 minutos:
#   1. Pide /api/health y exige HTTP 200 con "ok":true.
#   2. Si falla, el job falla -> GitHub manda email al dueno del repo.
#      (Settings -> Notifications -> Actions: "Send notifications for failed
#      workflows" debe estar activo; lo esta por defecto.)
#   3. Si va bien, deja un latido en el servidor que /admin/live muestra.
#
# Por que 30 y no 10: GitHub cobra cada job con minimo de 1 minuto, y en un
# repo PRIVADO el plan Free da 2.000 min/mes. Cada 10 min = 4.320 runs = mas
# del doble; las sondas se agotarian a mitad de mes y dejarian de correr sin
# avisar. Cada 30 min = 1.440, cabe. Si el repo se hace publico, los minutos
# son ilimitados y se puede bajar a 5.
#
# El cron de GitHub es "best effort": en horas punta se retrasa 10-15 min.
# Por eso el panel considera el latido caducado a los 65, no a los 30.
#
# Secreto necesario: HEARTBEAT_TOKEN (Settings -> Secrets -> Actions), con el
# mismo valor que HEARTBEAT_TOKEN en server/.env del VPS.

name: uptime

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe /api/health from outside
        run: |
          set -u
          url="https://thebookswanderer.com/api/health"
          # 3 intentos con pausa: un blip de red no debe disparar una alerta.
          for i in 1 2 3; do
            body=$(curl -sS --max-time 20 -w '\n%{http_code}' "$url" 2>&1) && break
            echo "intento $i fallo: $body"; sleep 20
          done
          code=$(printf '%s' "$body" | tail -n1)
          json=$(printf '%s' "$body" | sed '$d')
          echo "HTTP $code"
          echo "$json" | head -c 300; echo
          if [ "$code" != "200" ]; then
            echo "::error::La tienda no responde 200 (HTTP $code)"; exit 1
          fi
          if ! printf '%s' "$json" | grep -q '"ok": *true'; then
            echo "::error::/api/health responde pero no dice ok:true"; exit 1
          fi

      - name: Leave a heartbeat for /admin/live
        if: success()
        env:
          TOKEN: ${{ secrets.HEARTBEAT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::HEARTBEAT_TOKEN no configurado; la sonda funciona pero el panel no vera latidos"
            exit 0
          fi
          curl -sS --max-time 15 -X POST \
            -H "X-Heartbeat-Token: $TOKEN" \
            -H "X-Heartbeat-Source: github-actions ${{ github.run_id }}" \
            https://thebookswanderer.com/api/admin/heartbeat \
            && echo " latido enviado" || echo "::warning::el latido no llego (la sonda si paso)"
